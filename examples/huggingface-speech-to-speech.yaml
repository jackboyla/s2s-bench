version: 1
name: hf-speech-to-speech-local

target:
  url: ws://127.0.0.1:8765/v1/realtime?model=local

load:
  sessions: 1
  concurrency: 1

timeout_s: 45

session:
  type: realtime
  instructions: Answer in one short sentence.
  audio:
    input:
      format:
        type: audio/pcm
        rate: 24000
      turn_detection:
        type: server_vad
        interrupt_response: true
    output:
      format:
        type: audio/pcm
        rate: 24000

turns:
  # Replace this path with a mono PCM16 WAV at 24 kHz. Include about 500 ms
  # of trailing silence so server VAD can close the utterance.
  - name: warm-turn
    audio: ./utterance-24khz.wav
  - name: measured-turn
    audio: ./utterance-24khz.wav
  - name: cancellation
    audio: ./utterance-24khz.wav
    cancel_after_first_audio_ms: 100

budgets:
  - metric: success_rate
    min_rate: 1.0
  - metric: e2e_first_audio
    percentile: p95
    max_ms: 1500
  - metric: cancellation
    percentile: p95
    max_ms: 250
