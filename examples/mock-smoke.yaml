version: 1
name: mock-smoke

target:
  url: ws://127.0.0.1:9876/v1/realtime

load:
  sessions: 8
  concurrency: 4
  ramp_up_s: 0.2

timeout_s: 5

session:
  type: realtime
  instructions: Answer in one short sentence.
  audio:
    input:
      format:
        type: audio/pcm
        rate: 24000
      turn_detection:
        type: server_vad
        interrupt_response: true
    output:
      format:
        type: audio/pcm
        rate: 24000

faults:
  send_jitter_ms: 2
  drop_audio_probability: 0
  seed: 42

turns:
  - name: normal-response
    audio:
      source: synthetic:220:160
      sample_rate: 24000
      chunk_ms: 20
      pace: true
  - name: client-cancellation
    audio:
      source: synthetic:330:160
      sample_rate: 24000
      chunk_ms: 20
      pace: true
    cancel_after_first_audio_ms: 5

budgets:
  - metric: success_rate
    min_rate: 1.0
  - metric: e2e_first_audio
    percentile: p95
    max_ms: 250
  - metric: cancellation
    percentile: p95
    max_ms: 100
