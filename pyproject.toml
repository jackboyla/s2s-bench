[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "s2s-bench"
version = "0.1.0"
description = "A reproducible load and fault benchmark for realtime voice agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Jack Boylan", email = "boylan.jack@gmail.com" }]
keywords = ["voice-agent", "benchmark", "websocket", "realtime", "speech-to-speech"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Benchmark",
]
dependencies = [
  "PyYAML>=6.0.2,<7",
  "websockets>=14,<17",
]

[project.urls]
Homepage = "https://github.com/jackboyla/s2s-bench"
Issues = "https://github.com/jackboyla/s2s-bench/issues"
Repository = "https://github.com/jackboyla/s2s-bench"

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
  "types-PyYAML>=6.0.12,<7",
]

[project.scripts]
s2s-bench = "s2s_bench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/s2s_bench"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["s2s_bench"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["s2s_bench"]
